name: Feature request
description: Suggest a new tool, backend, or preset capability.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What scientific or agent workflow is currently impossible or awkward?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Tool name, backend approach, where it would live (plugin tool / skill resource / deploy script).
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: New dependencies
      description: Third-party libraries/models and their licenses (check THIRD_PARTY_NOTICES.md first).
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A concrete check that proves it works (positive control, reference numbers, expected output).
  - type: checkboxes
    id: platform
    attributes:
      label: Platform
      options:
        - label: Windows + PowerShell (current supported shell)
        - label: Linux/bash (requires a new backend variant)
